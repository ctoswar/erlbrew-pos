# Erlbrew POS — GitLab CI
#
# Jobs:
#   type-check      — TypeScript checks for the React/Vite frontend
#   test:server     — Express backend unit tests (node --test, no DB required)
#   build:frontend  — production build, dist/ kept as artifact for 1 week
#   secret-detection— scans commits for leaked API keys / tokens
#
# Runs on merge requests and pushes to the default branch (duplicates suppressed).

stages:
  - test
  - build

workflow:
  rules:
    # Run on merge requests...
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # ...but skip branch-push pipelines when the branch already has an open MR
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    # ...and on all other branch pushes
    - if: $CI_COMMIT_BRANCH

variables:
  GIT_DEPTH: "1"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

cache:
  key:
    files:
      - package-lock.json
      - server/package-lock.json
  paths:
    - .npm/

.node-setup:
  image: node:22
  before_script:
    - npm ci --no-audit --no-fund --cache "$npm_config_cache"
    - npm ci --no-audit --no-fund --cache "$npm_config_cache" --prefix server

type-check:
  extends: .node-setup
  stage: test
  script:
    - npm run type-check

test:server:
  extends: .node-setup
  stage: test
  script:
    - cd server && npm test

# Rust print server (print-server/) — unit tests for ESC/POS output parity,
# MAC parsing and config handling. No Bluetooth hardware needed: the RFCOMM
# transport is Linux-only at runtime, but everything it depends on compiles
# and tests fine on x86.
test:print-server:
  stage: test
  image: rust:1-slim-bookworm
  variables:
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo-home"
  cache:
    key:
      files:
        - print-server/Cargo.lock
    paths:
      - .cargo-home/
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends build-essential
    - rm -rf /var/lib/apt/lists/*
    - cd print-server
  script:
    - cargo test

build:frontend:
  extends: .node-setup
  stage: build
  script:
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

# Secret scanning with gitleaks — flags committed API keys/passwords/tokens.
# (GitLab CE's built-in Secret-Detection template is unavailable, so we run
# gitleaks directly. Scans the fetched history; shallow clone = recent commits.)
secret-scan:
  stage: test
  image:
    name: ghcr.io/gitleaks/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks detect --source . --config .gitleaks.toml --redact --verbose --no-banner
