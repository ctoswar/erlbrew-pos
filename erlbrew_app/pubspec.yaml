name: erlbrew_app
description: Erlbrew Café — rewards & pickup app (front-end only)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cloud_firestore: ^5.6.8
  cloud_functions: ^5.1.3
  firebase_auth: ^5.4.2
  firebase_core: ^3.13.1
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.6
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3
  http: ^1.2.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/erlbrew_logo.jpg
