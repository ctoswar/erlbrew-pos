<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none" >  <title>Pastry</title>
  <!-- shadow -->
  <ellipse cx="32" cy="53" rx="25" ry="3.500" fill="#CBB49A"/>
  <g stroke="#B8683A" stroke-width="1.800" stroke-linejoin="round">
    <!-- outer horns -->
    <ellipse cx="12.500" cy="42" rx="8.500" ry="5.500" transform="rotate(-50 12.500 42)" fill="#D98F4A"/>
    <ellipse cx="51.500" cy="42" rx="8.500" ry="5.500" transform="rotate(50 51.500 42)" fill="#D98F4A"/>
    <!-- mid segments -->
    <ellipse cx="20" cy="34" rx="11" ry="8.500" transform="rotate(-30 20 34)" fill="#E3A25C"/>
    <ellipse cx="44" cy="34" rx="11" ry="8.500" transform="rotate(30 44 34)" fill="#E3A25C"/>
    <!-- center -->
    <ellipse cx="32" cy="31" rx="11.500" ry="14.500" fill="#EDB36E"/>
  </g>
  <!-- highlights -->
  <g stroke="#F8D9A8" stroke-width="2.200" stroke-linecap="round">
    <path d="M28 22c-1.500 3-1.500 7 0 10"/>
    <path d="M15.500 31c2-2.500 4.500-3.500 7-3.500"/>
    <path d="M48.500 31c-2-2.500-4.500-3.500-7-3.500"/>
  </g>
  <!-- creases -->
  <g stroke="#B8683A" stroke-width="1.400" stroke-linecap="round" opacity=".55">
    <path d="M35.500 20c1.500 5 1.500 12 0 18"/>
    <path d="M26.500 42c-1.500-2-2-4-1.800-6"/>
    <path d="M37.500 42c1.500-2 2-4 1.800-6"/>
  </g>
</svg>
