# TLS-only: PWA install requires a secure context. nginx listens on 443 inside
# the container; docker-compose publishes it on host port 3004 (see compose file).
server {
    listen 443 ssl;

    # LAN certs generated with mkcert — see "Install as an Android app" in README.md.
    # Mounted read-only by docker-compose at /etc/nginx/certs.
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Declared at server level so the exact-match locations below inherit it.
    root /usr/share/nginx/html;

    # Missing static assets must 404. Without this block the SPA fallback in
    # `location /` answers 200 text/html for anything absent — including
    # manifest icons — so a broken manifest silently passes review and the
    # tablet only reports "This app cannot be installed".
    # (`/index.html`, `/manifest.json` and `/sw.js` are exact-match locations
    #  below, which always win over this regex.)
    location ~* \.(?:png|jpe?g|gif|svg|webp|ico|woff2?|ttf|otf|map|json|js|css|webmanifest)$ {
        try_files $uri =404;
    }

    # Frontend static files
    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ── PWA installability ────────────────────────────────────────────────────
    # Chrome heuristically caches any response served without Cache-Control. If a
    # tablet is left holding a pre-PWA copy of these three documents — HTML
    # without <link rel="manifest">, a stale sw.js, or a cached manifest fetch —
    # Chrome's installability check fails and the sheet shows
    # "This app cannot be installed", and it keeps failing across rebuilds.
    # no-cache forces revalidation on every load; nginx still answers 304 when
    # the file is unchanged.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # Proxy API requests to backend. ^~ so this prefix wins over the
    # static-asset regex above even for paths like /api/report.json.
    location ^~ /api/ {
        proxy_pass http://erlbw-api:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }
}
