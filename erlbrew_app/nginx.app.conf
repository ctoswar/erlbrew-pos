# Erlbrew Café customer PWA — static nginx config
# PWA hygiene mirrors the POS web container: hashed assets cached long,
# shell documents (index/manifest/service worker) always revalidated so
# Chrome sees fresh installs and updates instead of stale cache heuristics.

server {
    listen 80;
    root /usr/share/nginx/html;

    # Missing static assets must 404 (not fall through to index.html)
    location ~* \.(?:png|jpe?g|gif|svg|webp|ico|woff2?|ttf|otf|map|json|js|css|webmanifest|wasm)$ {
        try_files $uri =404;
    }

    # Hashed build assets — immutable. (Fonts under here are reached through
    # a per-build ?v= stamp from the Dockerfile, so their URL is unique per
    # build and immutable is safe.)
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Flutter asset manifests — REBUILT IN PLACE (stable name, new content
    # every build), same class as main.dart.js. They must always revalidate:
    # a stale FontManifest.json pinned the old MaterialIcons font URL, whose
    # year-long immutable cache kept serving the pre-fix subset (blank reward
    # icons) no matter how often the app was redeployed.
    location = /assets/FontManifest.json      { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /assets/AssetManifest.bin      { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /assets/AssetManifest.bin.json { add_header Cache-Control "no-cache"; try_files $uri =404; }

    # App shell — always revalidate.
    # These Flutter entry files are REBUILT IN PLACE (same filename, new content),
    # so they must never be cached by the browser OR the CDN — otherwise a stale
    # edge copy keeps serving the previous build (e.g. an old baked-in backend
    # URL causing mixed-content errors).
    location = /index.html                { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /main.dart.js              { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /flutter_bootstrap.js      { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /flutter_service_worker.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /version.json              { add_header Cache-Control "no-cache"; try_files $uri =404; }

    location = /manifest.json {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback
    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
