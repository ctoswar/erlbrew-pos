[package]
name = "erlbrew-print-server"
version = "1.0.0"
edition = "2021"
rust-version = "1.82"
description = "Low-latency ESC/POS print server for Erlbrew POS (Raspberry Pi + Bluetooth thermal printer)"
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0.105"
axum = "0.8.9"
axum-server = { version = "0.9.2", default-features = false, features = ["tls-rustls-ring"] }
dotenvy = "0.15.7"
rcgen = "0.14.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.191"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
