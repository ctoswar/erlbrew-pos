# Run this file from the repository root:
#   docker compose -f infra/docker-compose.yml up --build
# Paths below are relative to the repository root.

services:
  # ── Backend API ─────────────────────────────────────────────────────────────
  erlbw-api:
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: erlbw-api
    restart: unless-stopped
    expose:
      - "3001"                     # Internal port (not published to host)
    ports:
      - "3001:3001"                # Still accessible on host for dev/debug
    env_file:
      - ../server/.env             # All secrets come from .env — no hardcoded credentials
    environment:
      PORT: 3001
      # Optional AI briefing service. Start it with:
      # OLLAMA_ENABLED=true docker compose --profile ai up -d
      OLLAMA_ENABLED: ${OLLAMA_ENABLED:-false}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      OLLAMA_TIMEOUT_MS: ${OLLAMA_TIMEOUT_MS:-5000}
      # CORS: allow the frontend container by Docker DNS name
      # Also allow by IP range for direct tablet access on LAN
      # Override or append in your .env as needed
      CORS_ORIGINS: http://erlbrew-pos,http://localhost:3000,http://localhost:3004,http://pos.lan,http://192.168.*,http://172.*,http://100.*,https://pos.tirona.site,https://localhost,https://localhost:3004,https://pos.lan,https://pos.lan:3004,https://192.168.*,https://172.*,https://100.*
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/menu"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - erlbrew-net

  # Optional local model runtime. Analytics remain deterministic if this
  # profile is disabled or the model is unavailable.
  ollama:
    image: ollama/ollama:latest
    container_name: erlbrew-ollama
    profiles:
      - ai
    restart: unless-stopped
    expose:
      - "11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - erlbrew-net

  # ── Frontend (React → nginx) ────────────────────────────────────────────────
  erlbrew-pos:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      args:
        # VITE_API_URL empty → nginx proxies /api to backend (see nginx.conf)
        VITE_API_URL: ""
    container_name: erlbrew-pos
    restart: unless-stopped
    ports:
      # HTTPS on host port 3004 (host 443 is often taken — e.g. nginx-proxy-manager).
      # Prefer "443:443" if your host 443 is free, then open https://<server>/.
      - "3004:443"                  # TLS — required for PWA install on tablets
    volumes:
      - ./certs:/etc/nginx/certs:ro         # mkcert TLS certs (git-ignored)
    depends_on:
      erlbw-api:
        condition: service_healthy  # Don't start frontend until API is up
    healthcheck:
      test: ["CMD", "curl", "-fk", "https://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - erlbrew-net

networks:
  erlbrew-net:
    driver: bridge

volumes:
  ollama-data:
