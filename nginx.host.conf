# Host nginx config — use this when running nginx directly on the server
# (not inside Docker). It proxies /api to the backend on localhost:3001.
#
# The docker-specific config (infra/nginx.conf) uses http://erlbw-api:3001
# because Docker Compose resolves service names internally.

server {
    listen 443 ssl;

    # Update these paths to your actual certificate files.
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;

    # Frontend static files
    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # PWA files — force revalidation so tablets never cache stale manifests
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # Proxy API requests to backend running on the same host
    location /api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }
}
